<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed Nutrition — Calculadora y formulación de alimento</title>
<style>
:root {
  --bg: #f5f7fa; --panel: #ffffff; --border: #dfe3e8;
  --text: #1f2933; --muted: #6b7280; --accent: #1d6f42; --accent2: #2f9e62;
  --danger: #b42318; --warn: #b45309;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
header { background: linear-gradient(135deg, #1d6f42, #2f9e62); color: #fff; padding: 20px 24px; }
header h1 { margin: 0 0 4px; font-size: 22px; }
header p { margin: 0; opacity: .92; font-size: 13px; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px 0; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
nav.tabs button { border: none; background: none; padding: 12px 16px; font-size: 14px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; }
nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 16px 24px 40px; max-width: 1200px; margin: 0 auto; }
section[hidden] { display: none; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card h2 { margin: 0 0 12px; font-size: 16px; }
.card h3 { margin: 16px 0 8px; font-size: 14px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
label { font-size: 13px; color: var(--muted); display: block; margin: 6px 0 2px; }
input[type=text], input[type=number], select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
input[type=number] { max-width: 140px; }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
button:hover { background: var(--accent2); }
button.secondary { background: #eef2f6; color: var(--text); border: 1px solid var(--border); }
button.danger { background: var(--danger); }
button.small { padding: 4px 8px; font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; background: #fafbfc; position: sticky; top: 0; }
tr:hover td { background: #f7faf8; }
.scroll { max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
.checklist { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
.checklist label { display: flex; gap: 8px; align-items: center; color: var(--text); margin: 2px 0; padding: 2px 4px; border-radius: 4px; }
.checklist label:hover { background: #f0f6f2; }
.result-box { background: #f0f6f2; border: 1px solid #cfe6d6; border-radius: 8px; padding: 12px; margin-top: 8px; }
.muted { color: var(--muted); font-size: 12px; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
.badge.user { background: #e6f0ff; color: #1d4ed8; }
.badge.ref { background: #eef2f6; color: var(--muted); }
.badge.cheap { background: #dcfce7; color: #15803d; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0 12px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; }
.modal h3 { margin-top: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 600px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.tag { font-size: 11px; color: var(--muted); }
.error { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>Feed Nutrition</h1>
  <p>Calculadora de nutrición · Formulación de mínimo costo · Base de datos de ingredientes (los datos de referencia permanecen intactos)</p>
</header>
<nav class="tabs">
  <button data-tab="ingredients" class="active">Ingredientes</button>
  <button data-tab="calculator">Calculadora</button>
  <button data-tab="formulation">Formulación</button>
  <button data-tab="suggest">Sugerencias</button>
</nav>
<main>
  <section id="tab-ingredients"></section>
  <section id="tab-calculator" hidden></section>
  <section id="tab-formulation" hidden></section>
  <section id="tab-suggest" hidden></section>
</main>
<div id="modal-root"></div>
<script src="feed-data.js"></script>
<script src="solver.js"></script>
<script src="app.js"></script>
</body>
</html>
